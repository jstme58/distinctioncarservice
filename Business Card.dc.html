<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: oklch(0.9 0.003 260); font-family: 'Inter', sans-serif; }
  </style>
</helmet>

<div style="display:flex; flex-wrap:wrap; gap:48px; padding:48px; align-items:flex-start;">

  <!-- FRONT: 1125x675px = 3.75x2.25in @300dpi (bleed). Trim 3.5x2in centered; safe area inset further. -->
  <div style="width:1125px; height:675px; flex-shrink:0; background:oklch(0.12 0.004 260); position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 20px 50px oklch(0 0 0 / 0.25);">
    <div style="position:absolute; inset:37.5px; border:1px dashed oklch(1 0 0 / 0.15);"></div>
    <div style="position:absolute; inset:75px; border:1px solid oklch(0.76 0.12 85 / 0.35);"></div>
    <svg width="72" height="72" viewBox="0 0 72 72" style="margin-bottom:24px;">
      <rect x="1" y="1" width="70" height="70" fill="none" stroke="oklch(0.76 0.12 85)" stroke-width="1"/>
      <path d="M36 16 L36 56 M20 36 L52 36" stroke="oklch(0.76 0.12 85)" stroke-width="1"/>
      <rect x="30" y="30" width="12" height="12" fill="oklch(0.76 0.12 85)" transform="rotate(45 36 36)"/>
    </svg>
    <div style="font-family:'Playfair Display',serif; font-size:52px; font-weight:600; letter-spacing:4px; color:oklch(0.97 0.003 90); text-align:center;">DISTINCTION</div>
    <div style="font-size:20px; font-weight:500; letter-spacing:6px; color:oklch(0.76 0.12 85); margin-top:10px;">CAR SERVICE</div>
    <div style="font-family:'Playfair Display',serif; font-style:italic; font-size:19px; color:oklch(0.62 0.008 260); margin-top:26px;">Luxury on Wheels</div>
  </div>

  <!-- BACK: same bleed size, safe area padding -->
  <div style="width:1125px; height:675px; flex-shrink:0; box-sizing:border-box; background:oklch(0.12 0.004 260); position:relative; display:flex; flex-direction:column; justify-content:center; padding:0 128px; box-shadow:0 20px 50px oklch(0 0 0 / 0.25);">
    <div style="position:absolute; inset:37.5px; border:1px dashed oklch(1 0 0 / 0.15);"></div>
    <div style="position:absolute; inset:75px; border:1px solid oklch(0.76 0.12 85 / 0.35);"></div>
    <svg width="44" height="44" viewBox="0 0 72 72" style="margin-bottom:24px;">
      <rect x="1" y="1" width="70" height="70" fill="none" stroke="oklch(0.76 0.12 85)" stroke-width="1"/>
      <path d="M36 16 L36 56 M20 36 L52 36" stroke="oklch(0.76 0.12 85)" stroke-width="1"/>
      <rect x="30" y="30" width="12" height="12" fill="oklch(0.76 0.12 85)" transform="rotate(45 36 36)"/>
    </svg>
    <div style="font-family:'Playfair Display',serif; font-size:38px; font-weight:600; color:oklch(0.97 0.003 90); margin-bottom:6px;">{{ name }}</div>
    <div style="font-size:16px; letter-spacing:2px; color:oklch(0.76 0.12 85); text-transform:uppercase; margin-bottom:36px;">{{ title }}</div>
    <div style="width:64px; height:1px; background:oklch(0.76 0.12 85 / 0.4); margin-bottom:32px;"></div>
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="width:8px; height:8px; border-radius:50%; background:oklch(0.76 0.12 85); flex-shrink:0;"></span>
        <span style="font-size:19px; color:oklch(0.9 0.005 260); font-weight:500;">{{ phone }}</span>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="width:8px; height:8px; transform:rotate(45deg); background:oklch(0.76 0.12 85); flex-shrink:0;"></span>
        <span style="font-size:17px; color:oklch(0.8 0.005 260);">{{ email }}</span>
      </div>
      <div style="display:flex; align-items:center; gap:16px;">
        <span style="width:8px; height:8px; background:oklch(0.76 0.12 85); flex-shrink:0;"></span>
        <span style="font-size:15px; color:oklch(0.6 0.008 260); letter-spacing:0.5px;">distinctioncarservice.com</span>
      </div>
    </div>
    <div style="width:64px; height:1px; background:oklch(0.76 0.12 85 / 0.4); margin:32px 0 20px;"></div>
    <div style="font-size:13px; letter-spacing:1.5px; color:oklch(0.55 0.008 260); text-transform:uppercase; margin-bottom:26px;">Airport &middot; Corporate &middot; Events</div>
    <div style="position:absolute; right:100px; bottom:95px; display:flex; flex-direction:column; align-items:center; gap:8px;">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&bgcolor=1a1a1a&color=e8c874&data=https://distinctioncarservice.com" width="90" height="90" alt="QR code to book online" style="display:block;" />
      <span style="font-size:10px; letter-spacing:1px; color:oklch(0.55 0.008 260); text-transform:uppercase;">Scan to Book</span>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;name&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Jean David&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;title&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Chauffeur &amp; Reservations&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;phone&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;(774) 362-8115&quot;, &quot;tsType&quot;: &quot;string&quot;}, &quot;email&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;reservations@distinctioncarservice.com&quot;, &quot;tsType&quot;: &quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      name: this.props.name ?? 'Jean David',
      title: this.props.title ?? 'Chauffeur & Reservations',
      phone: this.props.phone ?? '(774) 362-8115',
      email: this.props.email ?? 'reservations@distinctioncarservice.com',
    };
  }
}

</script>
</body>
</html>
